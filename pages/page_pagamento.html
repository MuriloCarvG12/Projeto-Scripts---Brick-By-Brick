<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brick By Brick</title>
        <link rel="stylesheet" href=".././style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
    </head>
<body>
    <div id="container">

        <div class="header">
            <div style="display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 30px;">
                <img style="width: 100px; height: 100px; border: 6px; border-style: solid; border-color: rgb(31, 31, 31);" src=".././images/logo.png" alt="Image">
                <h2 style="font-family: 'Tahoma'; font-size: xx-large; font-weight: 300;">Brick By Brick</h2>
            </div>
        </div>

        <div id="lego_brick_top" style="display: flex; flex-direction: row; width: 73%; justify-content: space-around;">
            <div class="lego_brick_top" style="background-color: #ff7d03; border-color: #b95b03; border-bottom-left-radius: 0px; border-bottom-right-radius: 0px;"></div>
            <div class="lego_brick_top" style="background-color: #ff7d03; border-color: #b95b03;"></div>
            <div class="lego_brick_top" style="background-color: #ff7d03; border-color: #b95b03;"></div>
            <div class="lego_brick_top" style="background-color: #ff7d03; border-color: #b95b03; border-bottom-left-radius: 0px; border-bottom-right-radius: 0px;"></div>
            
        </div>
        <div style="background-color: #ff7d03; width: 90%; border-color: #b95b03; border-style: solid; border-width: 5px; text-align: center; padding-top: 2%; padding-bottom: 1%; width: 60%;">
            <h1 style="font-family: 'Poppins'; font-size: xx-large; font-weight: 500; color: white;">Finalizar Compra!</h1>
            <h1 style="font-family: 'Poppins'; font-size: xx-large; font-weight: 500; color: white;" id="product">Finalizar Compra!</h1>
            
         </div>
        <form id="page_payment" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <!-- Formulario para compras-->
            <div class="page_payment" style="justify-content: space-evenly; width: 57.5%; flex-direction: column;" >

                <div style="display: flex; flex-direction: column; margin-top: 40px;">
                    <label for="Nome" style="font-family: 'Poppins'; font-weight: 500; font-size: 20px;">Digite o seu email!</label>
                    <input name="Nome" type="text" class="purchase_input" id="purchase-email" placeholder="">
                </div>

                <div style="display: flex; flex-direction: column;">
                    <label for="Nome" style="font-family: 'Poppins'; font-weight: 500; font-size: 20px;">Digite o seu CPF!</label>
                    <input name="Nome" type="text" class="purchase_input" id="purchase-CPF" placeholder="">
                </div>

                <div style="display: flex; flex-direction: column;">
                    <label for="Nome" style="font-family: 'Poppins'; font-weight: 500; font-size: 20px;">Digite o seu endereço</label>
                    <input name="Nome" type="text" class="purchase_input" id="purchase-endereço" placeholder="">
                </div>

                <div style="display: flex; flex-direction: column;">
                    <label for="Nome" style="font-family: 'Poppins'; font-weight: 500; font-size: 20px;">Digite a senha do seu cartão!</label>
                    <input name="Nome" type="text" class="purchase_input" id="purchase-senha_cartao" placeholder="">
                </div>

                <div style="display: flex; flex-direction: column; margin-bottom: 40px;">
                    <label for="Nome" style="font-family: 'Poppins'; font-weight: 500; font-size: 20px;">Digite o código de segurança do seu cartão!</label>
                    <input name="Nome" type="text" class="purchase_input" id="purchase-codigo-cartao" placeholder="">
                </div>
                <!-- Divs para o botao Comprar estilizados para parecer um bloco de lego-->
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30%; margin-bottom: 50px; height: 80%; ">  
                    <div id="lego_brick_top" style="display: flex; flex-direction: row; width: 100%; justify-content: space-around;">
                        <div class="lego_brick_top" style="background-color: #AEEF97; border-color: #27462B;"></div>
                        <div class="lego_brick_top" style="background-color: #AEEF97; border-color: #27462B;"></div>
                    </div>
                    <div class="lego_brick_body" style="width: 100%; height: 20%; background-color: #AEEF97; border-color: #27462B; padding: 0px;">
                        <div style="display:flex; flex-direction:column; gap: 30px;">
                            <button class="lego-button" style="margin-bottom: 25px; background-color: #AEEF97; border-style: none; font-family: 'Bricolage Grotesque'; font-weight: 400; font-size: 25px; width: 100%; height: 100%; margin-top: 20px; letter-spacing: 1px; color: #27462B;" type="submit">Comprar</button>
                    </div>                  
                </div>      
            </div>
        </form>

        <!-- Divs para o botao Cancelar estilizados para parecer um bloco de lego-->
         <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30%; margin-bottom: 50px; height: 80%; ">  
                <div id="lego_brick_top" style="display: flex; flex-direction: row; width: 100%; justify-content: space-around;">
                    <div class="lego_brick_top" style="background-color: #FF9CAB; border-color: #720000;"></div>
                    <div class="lego_brick_top" style="background-color: #FF9CAB; border-color: #720000;"></div>
                </div>
                <div class="lego_brick_body" style="width: 100%; height: 20%; background-color: #FF9CAB; border-color: #720000; padding: 0px;">
                    <div style="display:flex; flex-direction:column; gap: 30px;">
                        <button class="lego-button" style="margin-bottom: 25px; background-color: #FF9CAB; border-style: none; font-family: 'Bricolage Grotesque'; font-weight: 400; font-size: 25px; width: 100%; height: 100%; margin-top: 20px; letter-spacing: 1px; color: #850014;">Cancelar Compra</button>
                </div>                  
            </div>
          
        
    

    </div>

    
    <script src="../scripts/page_pagamento.js"></script>
</body>


</html>
