<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Brick By Brick</title>
        <link rel="stylesheet" href=".././style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    </head>
<body>
    <div id="container">

        <div class="header">
            <div style="display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 30px;">
                <img style="width: 100px; height: 100px; border: 6px; border-style: solid; border-color: rgb(31, 31, 31);" src=".././images/logo.png" alt="Image">
                <h2 style="font-family: 'Tahoma'; font-size: xx-large; font-weight: 300;">Brick By Brick</h2>
            </div>
        </div>

        <div style="background-color: #ff7d03; width: 90%; border-color: #ff7d03; border-style: solid; border-width: 5px; text-align: center; padding-top: 2%; padding-bottom: 1%; width: 60%;">
            <h1 style="font-family: 'Poppins'; font-size: xx-large; font-weight: 500; color: white;">Finalizar Compra!</h1>
         </div>

        <div class="page_body" style="justify-content: space-evenly; width: 60%; flex-direction: column;" >

            <div style="display: flex; flex-direction: column;">
                <label for="Nome">Digite o seu email!</label>
                <input name="Nome" type="text" class="purchase_input">
            </div>

            <div style="display: flex; flex-direction: column;">
                <label for="Nome">Digite o seu CPF!</label>
                <input name="Nome" type="text" class="purchase_input">
            </div>

            <div style="display: flex; flex-direction: column;">
                <label for="Nome">Digite o seu endereço</label>
                <input name="Nome" type="text" class="purchase_input">
            </div>

            <div style="display: flex; flex-direction: column;">
                <label for="Nome">Digite a senha do seu cartão!</label>
                <input name="Nome" type="text" class="purchase_input">
            </div>

            <div style="display: flex; flex-direction: column;">
                <label for="Nome">Digite o código de segurança do seu cartão!</label>
                <input name="Nome" type="text" class="purchase_input">
            </div>

            <button class="lego-button" style="margin-bottom: 25px;">Comprar</button>

        </div>

    </div>

</body>
</html>
