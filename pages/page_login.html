<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick By Brick</title>
    <link rel="stylesheet" href=".././style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
</head>
<body>
    <div id="container">

        <div class="header">
            <div style="display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 30px;">
                <img style="width: 100px; height: 100px; border: 6px; border-style: solid; border-color: rgb(31, 31, 31);" src=".././images/logo.png" alt="Image">
                <h2 style="font-family: 'Tahoma'; font-size: xx-large; font-weight: 300;">Brick By Brick</h2>
            </div>

            <div style="display: flex; flex-direction: row; gap: 30px; justify-self: right; margin-top: 30px; margin-right: 60px;">
                <h3>Quem somos nós?</h3>
                <h3>Suporte</h3>
                <h3>Sobre o Projeto</h3>
            </div>
        </div>
        
        
        <img style="width: 90.5%; height: 450px; margin: 0px; padding: 0px;" src="https://www.lego.com/cdn/cs/set/assets/bltc517ecd0181acb45/Hero_Banner_-_Desktop.png?fit=crop&format=jpg&quality=80&width=1600&height=500&dpr=1" alt="Image">


        <!-- Esta é a para o conteudo principal da pagina -->
        <div id="page_login_body" class="page_body">
            <!-- Esta é a div para a imagem ao lado do login -->
             
            <div id="page_login_image" style="width: 45%; height: 100%; align-content: center; justify-content: center; text-align: center;">
                <img style="width: 91%; height: 90%; border: 5px; border-radius: 50px; " src=".././images/login_image.webp" alt="Image">
                <h3 style="margin-bottom: 25px; font-family: 'Tahoma'; margin-top: 25px;">Brick By Brick </h3>
                <h3>Conjunto Casa de Passaros + Chalés Acouchegantes</h3>
            </div>
            
            <!-- Esta é a div para o login -->
            <div style="width: 44%; height: 100%;  margin-left: 2%; display: flex; flex-direction: column; align-items: center; justify-content: center;">

                <img style="width: 600px; height: 30%;" src=".././images/ChatGPT Image Mar 30, 2025, 03_43_54 PM.png" alt="Image">

                <!-- Esta é a div para o formulario login -->
                <div class="form_body">
                    <div style="width: 100%; height: 20%; background-color: #ffce1c; text-align: center; padding-bottom: 20px;">

                        
                        <h1 style="padding-top: 30px; font-family: 'Poppins'; font-size: 40px;">Login</h1>
                    </div>
                    

                    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                        <label for="field_username" style="margin-bottom: 10px; font-family: 'Tahoma'; font-size: medium; font-weight: 300;" >Insira o seu nome</label>
                        <input name="field_username" id="field_username" type="text" placeholder="Digite seu Nome!" style="width: 70%">
                    </div>
                    
                    <div style="display: flex; flex-direction: column;  align-items: center; width: 100%; margin-bottom: 20px;">
                        <label for="field_password" style="margin-bottom: 10px; font-family: 'Tahoma'; font-size: medium; font-weight: 300;" >Insira sua senha</label>
                        <input name="field_password" id="field_password" type="text" placeholder="Digite sua senha!" style="width: 70%">
                    </div>
                    
                    <button class="lego-button" style="margin-bottom: 25px;">Entrar</button>

                   
                </div>
                
            </div>

        </div>

        <div class="footer">
            <h1 style="font-size: 20px;">Projeto - Brick By Brick</h1>
        </div>

    </div>
</body>
</html>
