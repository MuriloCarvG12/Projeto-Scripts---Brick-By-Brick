<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick By Brick</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">

        <div class="header">
            <div style="display: flex; flex-direction: row; gap: 30px; justify-self: right; margin-top: 30px; margin-right: 60px;">
                <h3>Quem somos nós?</h3>
                <h3>Suporte</h3>
                <h3>Sobre o Projeto</h3>
            </div>
        </div>

        <div id="page_login_body" style="display: flex; flex-direction: row; width: 100vw; height: 70vh; background-color: blueviolet; padding: 20px;">

            <div id="page_login_image" style="width: 35%; height: 100%; background-color: blue; margin-left: 10%;">
            </div>
            
            <div style="width: 44%; height: 100%;  margin-left: 2%; display: flex; flex-direction: column; align-items: center; ">

                <img style="width: 100%; height: 30%;" src="./images/ChatGPT Image Mar 30, 2025, 03_43_54 PM.png" alt="Image">
    
                <div class="form_body">
                    <h1>Login</h1>

                    <div style="display: flex; flex-direction: column;">
                        <label for="field_username">Insira o seu nome</label>
                        <input name="field_username" id="field_username" type="text" placeholder="Digite seu Nome!">
                    </div>
                    
                    <div style="display: flex; flex-direction: column;">
                        <label for="field_password">Insira sua senha</label>
                        <input name="field_password" id="field_password" type="text" placeholder="Digite sua senha!">
                    </div>
                    

                   
                </div>
                
            </div>

        </div>

        <div class="footer">

        </div>

    </div>
</body>
</html>
